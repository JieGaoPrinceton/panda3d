  <!-- 标题 -->
  <text x="450" y="45" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">🎮 Panda3D 引擎功能覆盖率 — my_game v0.7.0</text>
  <text x="450" y="70" text-anchor="middle" fill="#8b949e" font-size="13">16 大类 · 95 项功能 · 已实现 50 项 · 总覆盖率 55%</text>

  <!-- 图例 -->
  <rect x="620" y="85" width="14" height="14" rx="3" fill="url(#barGreen)"/>
  <text x="640" y="97" fill="#3fb950" font-size="12">已实现</text>
  <rect x="700" y="85" width="14" height="14" rx="3" fill="url(#barGray)"/>
  <text x="720" y="97" fill="#8b949e" font-size="12">未实现</text>

  <!-- 数据行 -->
