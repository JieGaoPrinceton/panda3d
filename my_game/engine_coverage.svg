    <rect x="220" y="2" width="400" height="18" rx="4" fill="url(#barGray)" filter="url(#shadow)"/>
    <rect x="220" y="2" width="246" height="18" rx="4" fill="url(#barGreen)"/>
    <text x="630" y="16" fill="#3fb950" font-size="12" font-weight="bold">62%</text>
    <text x="700" y="16" fill="#8b949e" font-size="11">8 / 13</text>
  </g>

