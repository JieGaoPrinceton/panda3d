<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="794" height="1123" viewBox="0 0 794 1123"
     font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">

  <!-- White background -->
  <rect width="794" height="1123" fill="#FFFFFF"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="794" height="8" fill="#1565C0"/>

  <!-- Left accent stripe -->
  <rect x="60" y="8" width="4" height="1107" fill="#1565C0"/>

  <!-- Subtle background pattern (dots) -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#E3F2FD" opacity="0.8"/>
  </pattern>
  <rect x="64" y="8" width="730" height="1107" fill="url(#dots)"/>

  <!-- ── Logo image (embedded via xlink) ── -->
  <image href="panda3d_logo.svg" x="197" y="60" width="400" height="400"/>

  <!-- Divider line -->
  <line x1="100" y1="478" x2="694" y2="478" stroke="#1565C0" stroke-width="2"/>
  <line x1="100" y1="483" x2="694" y2="483" stroke="#E3F2FD" stroke-width="1"/>

  <!-- ── Report Title ── -->
  <text x="397" y="534" text-anchor="middle" font-size="30" font-weight="bold" fill="#212121">代码结构技术报告</text>
  <text x="397" y="566" text-anchor="middle" font-size="14" fill="#546E7A" letter-spacing="2">Technical Architecture Report</text>

  <!-- ── One-line Abstract ── -->
  <rect x="100" y="592" width="594" height="84" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1"/>
  <rect x="100" y="592" width="4" height="84" fill="#1565C0"/>
  <text x="397" y="618" text-anchor="middle" font-size="13" fill="#1565C0" font-weight="bold">摘要 Abstract</text>
  <text x="397" y="640" text-anchor="middle" font-size="11.5" fill="#37474F">深入分析 Panda3D 引擎 C++/Python 双层架构，</text>
  <text x="397" y="658" text-anchor="middle" font-size="11.5" fill="#37474F">涵盖场景图、渲染管线、动画、碰撞与物理系统的核心算法。</text>

  <!-- ── Metadata ── -->
  <text x="397" y="722" text-anchor="middle" font-size="12" fill="#546E7A">版本 / Version</text>
  <text x="397" y="746" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">master branch · 2025</text>

  <text x="397" y="790" text-anchor="middle" font-size="12" fill="#546E7A">生成日期 / Date</text>
  <text x="397" y="814" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">2025 年 5 月</text>

  <text x="397" y="856" text-anchor="middle" font-size="12" fill="#546E7A">覆盖模块 / Coverage</text>
  <text x="397" y="876" text-anchor="middle" font-size="11" fill="#37474F">dtool · pgraph · display · gobj · chan · collide · bullet · egg · direct · pandatool</text>

  <!-- Stats row -->
  <rect x="100" y="900" width="174" height="72" rx="4" fill="#F5F5F5" stroke="#B0BEC5" stroke-width="1"/>
  <text x="187" y="930" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565C0">15</text>
  <text x="187" y="952" text-anchor="middle" font-size="11" fill="#546E7A">章节 Chapters</text>

  <rect x="310" y="900" width="174" height="72" rx="4" fill="#F5F5F5" stroke="#B0BEC5" stroke-width="1"/>
  <text x="397" y="930" text-anchor="middle" font-size="26" font-weight="bold" fill="#2E7D32">5</text>
  <text x="397" y="952" text-anchor="middle" font-size="11" fill="#546E7A">架构图 Diagrams</text>

  <rect x="520" y="900" width="174" height="72" rx="4" fill="#F5F5F5" stroke="#B0BEC5" stroke-width="1"/>
  <text x="607" y="930" text-anchor="middle" font-size="26" font-weight="bold" fill="#E65100">50+</text>
  <text x="607" y="952" text-anchor="middle" font-size="11" fill="#546E7A">子模块 Submodules</text>

  <!-- Bottom bar -->
  <rect x="0" y="1107" width="794" height="16" fill="#1565C0"/>
  <text x="397" y="1119" text-anchor="middle" font-size="9" fill="#FFFFFF" letter-spacing="1">Panda3D Engine · Carnegie Mellon University · Open Source · BSD License</text>
</svg>
