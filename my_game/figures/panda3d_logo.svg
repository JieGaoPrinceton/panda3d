<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"
     font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <!-- Badge gradient -->
    <radialGradient id="badgeBg" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#1E3A6E"/>
      <stop offset="60%" stop-color="#0D2347"/>
      <stop offset="100%" stop-color="#061428"/>
    </radialGradient>
    <!-- Badge rim -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D3B8C"/>
    </linearGradient>
    <!-- Panda body white -->
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </radialGradient>
    <!-- Eye patch -->
    <radialGradient id="patchGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <!-- Ear -->
    <radialGradient id="earGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <!-- Highlight -->
    <radialGradient id="hlGrad" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip circle -->
    <clipPath id="circleClip">
      <circle cx="200" cy="190" r="158"/>
    </clipPath>
  </defs>

  <!-- ── Outer ring (glow) ── -->
  <circle cx="200" cy="190" r="175" fill="none" stroke="#4A90D9" stroke-width="2" opacity="0.3" filter="url(#glow)"/>

  <!-- ── Badge rim ── -->
  <circle cx="200" cy="190" r="168" fill="url(#rimGrad)" filter="url(#dropShadow)"/>

  <!-- ── Badge background ── -->
  <circle cx="200" cy="190" r="160" fill="url(#badgeBg)"/>

  <!-- ── Subtle grid lines (tech feel) ── -->
  <g clip-path="url(#circleClip)" opacity="0.06">
    <line x1="40" y1="110" x2="360" y2="110" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="40" y1="150" x2="360" y2="150" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="40" y1="190" x2="360" y2="190" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="40" y1="230" x2="360" y2="230" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="40" y1="270" x2="360" y2="270" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="120" y1="30" x2="120" y2="350" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="160" y1="30" x2="160" y2="350" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="200" y1="30" x2="200" y2="350" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="240" y1="30" x2="240" y2="350" stroke="#7ecfff" stroke-width="0.8"/>
    <line x1="280" y1="30" x2="280" y2="350" stroke="#7ecfff" stroke-width="0.8"/>
  </g>

  <!-- ── Panda Face ── -->
  <!-- Ears (behind face) -->
  <ellipse cx="148" cy="108" rx="36" ry="34" fill="url(#earGrad)" filter="url(#softShadow)"/>
  <ellipse cx="252" cy="108" rx="36" ry="34" fill="url(#earGrad)" filter="url(#softShadow)"/>
  <!-- Inner ear highlight -->
  <ellipse cx="148" cy="108" rx="20" ry="18" fill="#222222"/>
  <ellipse cx="252" cy="108" rx="20" ry="18" fill="#222222"/>
  <ellipse cx="145" cy="105" rx="8" ry="7" fill="#2A2A2A" opacity="0.6"/>
  <ellipse cx="249" cy="105" rx="8" ry="7" fill="#2A2A2A" opacity="0.6"/>

  <!-- Face base -->
  <ellipse cx="200" cy="185" rx="108" ry="100" fill="url(#faceGrad)" filter="url(#softShadow)"/>

  <!-- Eye patches -->
  <ellipse cx="165" cy="168" rx="34" ry="30" fill="url(#patchGrad)" transform="rotate(-12,165,168)"/>
  <ellipse cx="235" cy="168" rx="34" ry="30" fill="url(#patchGrad)" transform="rotate(12,235,168)"/>

  <!-- Eyes (white sclera) -->
  <circle cx="165" cy="168" r="16" fill="#FFFFFF"/>
  <circle cx="235" cy="168" r="16" fill="#FFFFFF"/>

  <!-- Iris -->
  <circle cx="165" cy="170" r="10" fill="#1A3A7A"/>
  <circle cx="235" cy="170" r="10" fill="#1A3A7A"/>

  <!-- Pupil -->
  <circle cx="166" cy="171" r="6" fill="#050D1A"/>
  <circle cx="236" cy="171" r="6" fill="#050D1A"/>

  <!-- Eye shine (main) -->
  <circle cx="170" cy="166" r="3.5" fill="rgba(255,255,255,0.95)"/>
  <circle cx="240" cy="166" r="3.5" fill="rgba(255,255,255,0.95)"/>
  <!-- Eye shine (small) -->
  <circle cx="162" cy="174" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="232" cy="174" r="1.5" fill="rgba(255,255,255,0.6)"/>

  <!-- Nose -->
  <ellipse cx="200" cy="200" rx="13" ry="9" fill="#1A1A1A"/>
  <ellipse cx="197" cy="198" rx="4" ry="3" fill="rgba(255,255,255,0.25)"/>

  <!-- Mouth -->
  <path d="M 190 210 Q 200 222 210 210" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <line x1="200" y1="209" x2="200" y2="215" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="148" cy="205" rx="20" ry="12" fill="#FFB3BA" opacity="0.35"/>
  <ellipse cx="252" cy="205" rx="20" ry="12" fill="#FFB3BA" opacity="0.35"/>

  <!-- Face highlight (top) -->
  <ellipse cx="185" cy="148" rx="30" ry="18" fill="url(#hlGrad)" opacity="0.4"/>

  <!-- ── Bottom text area ── -->
  <!-- Separator line -->
  <line x1="80" y1="298" x2="320" y2="298" stroke="#4A90D9" stroke-width="1" opacity="0.6"/>

  <!-- "Panda3D" text -->
  <text x="200" y="328" text-anchor="middle"
        font-size="36" font-weight="bold" letter-spacing="3"
        fill="none" stroke="#4A90D9" stroke-width="0.5">
    Panda3D
  </text>
  <text x="200" y="328" text-anchor="middle"
        font-size="36" font-weight="bold" letter-spacing="3"
        fill="#FFFFFF">
    Panda3D
  </text>

  <!-- "ENGINE" subtitle -->
  <text x="200" y="350" text-anchor="middle"
        font-size="11" letter-spacing="6"
        fill="#4A90D9" opacity="0.9">
    ENGINE
  </text>

  <!-- Version dots -->
  <circle cx="170" cy="368" r="2" fill="#4A90D9" opacity="0.5"/>
  <circle cx="200" cy="368" r="2" fill="#4A90D9" opacity="0.8"/>
  <circle cx="230" cy="368" r="2" fill="#4A90D9" opacity="0.5"/>

  <!-- ── Rim highlight (top-left arc) ── -->
  <path d="M 80 100 A 160 160 0 0 1 200 32" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
