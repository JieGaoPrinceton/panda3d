<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" font-family="'Times New Roman', 'Noto Serif SC', Georgia, serif">

  <!-- 白色背景 + 边框 -->
  <rect width="720" height="680" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="719" height="679" fill="none" stroke="#000" stroke-width="1"/>

  <!-- 标题 -->
  <text x="360" y="32" text-anchor="middle" fill="#000" font-size="16" font-weight="bold" font-style="italic">Fig. 1</text>
  <text x="360" y="52" text-anchor="middle" fill="#000" font-size="14">Panda3D Engine Feature Coverage Analysis (my_game v0.7.0)</text>
  <text x="360" y="70" text-anchor="middle" fill="#555" font-size="11">N = 95 features across 16 subsystems · Overall coverage: 55%</text>

  <!-- 坐标轴区域: x=100..620, y=90..600 -->
  <!-- Y 轴 -->
  <line x1="100" y1="90" x2="100" y2="600" stroke="#000" stroke-width="1.5"/>
  <!-- X 轴 -->
  <line x1="100" y1="600" x2="620" y2="600" stroke="#000" stroke-width="1.5"/>

  <!-- X 轴刻度线 & 标签 (0%, 20%, 40%, 60%, 80%, 100%) -->
  <g fill="#333" font-size="10" text-anchor="middle">
    <line x1="100" y1="600" x2="100" y2="605" stroke="#000" stroke-width="1"/>
    <text x="100" y="618">0%</text>
    <line x1="204" y1="600" x2="204" y2="605" stroke="#000" stroke-width="1"/>
    <text x="204" y="618">20%</text>
    <line x1="308" y1="600" x2="308" y2="605" stroke="#000" stroke-width="1"/>
    <text x="308" y="618">40%</text>
    <line x1="412" y1="600" x2="412" y2="605" stroke="#000" stroke-width="1"/>
    <text x="412" y="618">60%</text>
    <line x1="516" y1="600" x2="516" y2="605" stroke="#000" stroke-width="1"/>
    <text x="516" y="618">80%</text>
    <line x1="620" y1="600" x2="620" y2="605" stroke="#000" stroke-width="1"/>
    <text x="620" y="618">100%</text>
  </g>

  <!-- X 轴标题 -->
  <text x="360" y="640" text-anchor="middle" fill="#000" font-size="12" font-style="italic">Coverage Rate (%)</text>

  <!-- 网格线 (虚线) -->
  <g stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,3">
    <line x1="204" y1="90" x2="204" y2="600"/>
    <line x1="308" y1="90" x2="308" y2="600"/>
    <line x1="412" y1="90" x2="412" y2="600"/>
    <line x1="516" y1="90" x2="516" y2="600"/>
    <line x1="620" y1="90" x2="620" y2="600"/>
  </g>

  <!-- 50% 参考线 (红色虚线) -->
  <line x1="360" y1="90" x2="360" y2="600" stroke="#cc0000" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="362" y="88" fill="#cc0000" font-size="9" font-style="italic">50% threshold</text>

  <!-- 条形图数据 (从上到下，按覆盖率降序排列) -->
  <!-- 每行高度 30px，条形高度 20px，间距 10px -->
  <!-- barWidth = coverage * 520 / 100 -->

  <!-- Row 1: 任务 & 事件 100% -->
  <g>
    <text x="96" y="110" text-anchor="end" fill="#000" font-size="11">Task &amp; Event</text>
    <rect x="100" y="97" width="520" height="20" fill="#2166ac" stroke="#1a5490" stroke-width="0.5"/>
    <text x="625" y="112" fill="#000" font-size="10" font-weight="bold">100%</text>
    <text x="670" y="112" fill="#666" font-size="9">(3/3)</text>
  </g>

  <!-- Row 2: 粒子系统 75% -->
  <g>
    <text x="96" y="142" text-anchor="end" fill="#000" font-size="11">Particle System</text>
    <rect x="100" y="129" width="390" height="20" fill="#4393c3" stroke="#3580ad" stroke-width="0.5"/>
    <text x="625" y="144" fill="#000" font-size="10" font-weight="bold">75%</text>
    <text x="670" y="144" fill="#666" font-size="9">(3/4)</text>
  </g>

  <!-- Row 3: 文本 & 字体 75% -->
  <g>
    <text x="96" y="174" text-anchor="end" fill="#000" font-size="11">Text &amp; Font</text>
    <rect x="100" y="161" width="390" height="20" fill="#4393c3" stroke="#3580ad" stroke-width="0.5"/>
    <text x="625" y="176" fill="#000" font-size="10" font-weight="bold">75%</text>
    <text x="670" y="176" fill="#666" font-size="9">(3/4)</text>
  </g>

  <!-- Row 4: 后处理滤镜 71% -->
  <g>
    <text x="96" y="206" text-anchor="end" fill="#000" font-size="11">Post-Processing</text>
    <rect x="100" y="193" width="370" height="20" fill="#4393c3" stroke="#3580ad" stroke-width="0.5"/>
    <text x="625" y="208" fill="#000" font-size="10" font-weight="bold">71%</text>
    <text x="670" y="208" fill="#666" font-size="9">(5/7)</text>
  </g>

  <!-- Row 5: 文件 & 资源 67% -->
  <g>
    <text x="96" y="238" text-anchor="end" fill="#000" font-size="11">File &amp; Resource</text>
    <rect x="100" y="225" width="348" height="20" fill="#92c5de" stroke="#7db3cc" stroke-width="0.5"/>
    <text x="625" y="240" fill="#000" font-size="10" font-weight="bold">67%</text>
    <text x="670" y="240" fill="#666" font-size="9">(4/6)</text>
  </g>

  <!-- Row 6: 场景图 & 渲染 62% -->
  <g>
    <text x="96" y="270" text-anchor="end" fill="#000" font-size="11">Scene Graph</text>
    <rect x="100" y="257" width="322" height="20" fill="#92c5de" stroke="#7db3cc" stroke-width="0.5"/>
    <text x="625" y="272" fill="#000" font-size="10" font-weight="bold">62%</text>
    <text x="670" y="272" fill="#666" font-size="9">(8/13)</text>
  </g>

  <!-- Row 7: 碰撞检测 60% -->
  <g>
    <text x="96" y="302" text-anchor="end" fill="#000" font-size="11">Collision</text>
    <rect x="100" y="289" width="312" height="20" fill="#92c5de" stroke="#7db3cc" stroke-width="0.5"/>
    <text x="625" y="304" fill="#000" font-size="10" font-weight="bold">60%</text>
    <text x="670" y="304" fill="#666" font-size="9">(3/5)</text>
  </g>

  <!-- Row 8: GUI 系统 56% -->
  <g>
    <text x="96" y="334" text-anchor="end" fill="#000" font-size="11">GUI (DirectGUI)</text>
    <rect x="100" y="321" width="289" height="20" fill="#d1e5f0" stroke="#b8cfe0" stroke-width="0.5"/>
    <text x="625" y="336" fill="#000" font-size="10" font-weight="bold">56%</text>
    <text x="670" y="336" fill="#666" font-size="9">(5/9)</text>
  </g>

  <!-- Row 9: 窗口 & 显示 50% -->
  <g>
    <text x="96" y="366" text-anchor="end" fill="#000" font-size="11">Window &amp; Display</text>
    <rect x="100" y="353" width="260" height="20" fill="#d1e5f0" stroke="#b8cfe0" stroke-width="0.5"/>
    <text x="625" y="368" fill="#000" font-size="10" font-weight="bold">50%</text>
    <text x="670" y="368" fill="#666" font-size="9">(2/4)</text>
  </g>

  <!-- Row 10: 物理引擎 40% -->
  <g>
    <text x="96" y="398" text-anchor="end" fill="#000" font-size="11">Physics (Bullet)</text>
    <rect x="100" y="385" width="208" height="20" fill="#f4a582" stroke="#e09070" stroke-width="0.5"/>
    <text x="625" y="400" fill="#000" font-size="10" font-weight="bold">40%</text>
    <text x="670" y="400" fill="#666" font-size="9">(4/10)</text>
  </g>

  <!-- Row 11: 动画系统 40% -->
  <g>
    <text x="96" y="430" text-anchor="end" fill="#000" font-size="11">Animation</text>
    <rect x="100" y="417" width="208" height="20" fill="#f4a582" stroke="#e09070" stroke-width="0.5"/>
    <text x="625" y="432" fill="#000" font-size="10" font-weight="bold">40%</text>
    <text x="670" y="432" fill="#666" font-size="9">(2/5)</text>
  </g>

  <!-- Row 12: 音频系统 40% -->
  <g>
    <text x="96" y="462" text-anchor="end" fill="#000" font-size="11">Audio</text>
    <rect x="100" y="449" width="208" height="20" fill="#f4a582" stroke="#e09070" stroke-width="0.5"/>
    <text x="625" y="464" fill="#000" font-size="10" font-weight="bold">40%</text>
    <text x="670" y="464" fill="#666" font-size="9">(2/5)</text>
  </g>

  <!-- Row 13: 输入系统 40% -->
  <g>
    <text x="96" y="494" text-anchor="end" fill="#000" font-size="11">Input System</text>
    <rect x="100" y="481" width="208" height="20" fill="#f4a582" stroke="#e09070" stroke-width="0.5"/>
    <text x="625" y="496" fill="#000" font-size="10" font-weight="bold">40%</text>
    <text x="670" y="496" fill="#666" font-size="9">(2/5)</text>
  </g>

  <!-- Row 14: 光照 & 阴影 38% -->
  <g>
    <text x="96" y="526" text-anchor="end" fill="#000" font-size="11">Lighting &amp; Shadow</text>
    <rect x="100" y="513" width="196" height="20" fill="#d6604d" stroke="#c04e3d" stroke-width="0.5"/>
    <text x="625" y="528" fill="#000" font-size="10" font-weight="bold">38%</text>
    <text x="670" y="528" fill="#666" font-size="9">(3/8)</text>
  </g>

  <!-- Row 15: 地形 & 环境 25% -->
  <g>
    <text x="96" y="558" text-anchor="end" fill="#000" font-size="11">Terrain &amp; Env.</text>
    <rect x="100" y="545" width="130" height="20" fill="#b2182b" stroke="#9a1425" stroke-width="0.5"/>
    <text x="625" y="560" fill="#000" font-size="10" font-weight="bold">25%</text>
    <text x="670" y="560" fill="#666" font-size="9">(1/4)</text>
  </g>

  <!-- Row 16: 网络 & 分布式 0% -->
  <g>
    <text x="96" y="590" text-anchor="end" fill="#000" font-size="11">Networking</text>
    <rect x="100" y="577" width="4" height="20" fill="#67001f" stroke="#550018" stroke-width="0.5"/>
    <text x="625" y="592" fill="#000" font-size="10" font-weight="bold">0%</text>
    <text x="670" y="592" fill="#666" font-size="9">(0/3)</text>
  </g>

  <!-- 图例 (右上角) -->
  <g transform="translate(440, 85)">
    <rect x="0" y="0" width="170" height="70" fill="#fafafa" stroke="#ccc" stroke-width="0.5" rx="2"/>
    <text x="85" y="14" text-anchor="middle" fill="#000" font-size="10" font-weight="bold">Color Scale (RdBu)</text>
    <rect x="8" y="20" width="12" height="10" fill="#2166ac"/>
    <text x="25" y="29" fill="#333" font-size="9">≥ 75% (High)</text>
    <rect x="8" y="33" width="12" height="10" fill="#92c5de"/>
    <text x="25" y="42" fill="#333" font-size="9">50–74% (Medium)</text>
    <rect x="8" y="46" width="12" height="10" fill="#f4a582"/>
    <text x="25" y="55" fill="#333" font-size="9">25–49% (Low)</text>
    <rect x="8" y="59" width="12" height="10" fill="#b2182b"/>
    <text x="25" y="68" fill="#333" font-size="9">&lt; 25% (Critical)</text>
  </g>

  <!-- 底部注释 -->
  <text x="360" y="665" text-anchor="middle" fill="#888" font-size="9" font-style="italic">Data source: Panda3D 1.11.0 engine modules (panda/src, direct/src, samples/) · Sorted by coverage rate descending</text>

</svg>
